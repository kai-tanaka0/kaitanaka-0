name: Build Android APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java/JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Cordova & Build App
      run: |
        npm install -g cordova
        
        # 1. Create a pristine, isolated Cordova app setup first
        cordova create build_tmp it.undo.kanaka.kaitanaka "Kai Tanaka"
        
        # 2. Put your exact config settings into the app project root
        cp config.xml build_tmp/config.xml
        
        # 3. Wipe out Cordova's stock placeholder files
        rm -rf build_tmp/www/*
        
        # 4. Copy all website files, photos, and audio safely into the app asset folder
        cp -r index.html photos audio build_tmp/www/ 2>/dev/null || true
        cp -r *.html build_tmp/www/ 2>/dev/null || true
        
        # 5. Compile the Android app bundle cleanly
        cd build_tmp
        cordova platform add android
        cordova build android --no-telemetry

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Kai-Tanaka-App
        path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
