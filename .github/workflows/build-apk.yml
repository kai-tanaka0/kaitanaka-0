name: Build Android APK (Capacitor with Icons)
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java/JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build App with Capacitor
      run: |
        # 1. Initialize node package configuration
        npm init -y
        
        # 2. Install Capacitor and the asset engine
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install -D @capacitor/assets
        
        # 3. Create isolated web asset directory 
        mkdir dist
        
        # 4. Copy website assets cleanly into the distribution folder
        cp -r index.html photos ja audio dist/ 2>/dev/null || true
        cp -r *.html dist/ 2>/dev/null || true

        # 5. MANUALLY CREATE THE CONFIG FILE (No more ENOENT crashes!)
        echo '{
          "appId": "it.undo.kanaka.kaitanaka",
          "appName": "Kai Tanaka 2App,
          "webDir": "dist",
          "server": {
            "androidScheme": "http",
            "allowNavigation": ["*"]
          }
        }' > capacitor.config.json

        # 6. Inject the Android native scaffolding
        npx cap add android
        
        # 7. Automatically format and generate the app icons
        if [ -f "icon.png" ]; then
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android
        fi

        # 8. Sync web resources and build the APK
        npx cap sync android
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Kai-Tanaka-App
        path: android/app/build/outputs/apk/debug/app-debug.apk

